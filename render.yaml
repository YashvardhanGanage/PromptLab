services:
  - type: web
    name: promptlab-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MOCK_LLM
        value: "true"
      - key: DEFAULT_MODEL
        value: llama3.2:1b
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: DATABASE_PATH
        value: ./promptlab.db
